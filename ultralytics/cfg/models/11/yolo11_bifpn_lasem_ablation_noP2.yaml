# Ablation variant of yolo11_p2_bifpn_lasem.yaml with the P2 detection branch removed (P3/P4/P5 only), for
# isolating the P2 head's contribution in the VisDrone ablation study. Everything else - Dynamic BiFPN
# fusion (nn/modules/bifpn.py), DySample upsampling (nn/modules/dysample.py), LASEM (layer 11), and the
# opt-in Wise-IoU v3 loss (`iou_loss` below, utils/wiou.py) - is identical to yolo11_p2_bifpn_lasem.yaml.
# See IMPLEMENTATION_REPORT.md's ablation section for the other three components' toggles (they are single
# constructor-arg flips within yolo11_p2_bifpn_lasem.yaml itself, so they do not need separate yaml files).

# Parameters
nc: 80 # number of classes
iou_loss: wiou_v3
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (unchanged - keeps pretrained yolo11n.pt weight compatibility)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (P3 tap)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (P4 tap)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, LASEM, []] # 11

# Dynamic BiFPN + DySample head, P3/P4/P5 only (no P2 branch)
head:
  - [-1, 1, DySample, [2, "lp", 4, True]] # 12: dynamic upsample P5(LASEM) to P4 resolution
  - [[6, 12], 1, DynamicBiFPNFusion, [1]] # 13
  - [-1, 2, C3k2, [512, False]] # 14 (P4_td)

  - [-1, 1, DySample, [2, "lp", 4, True]] # 15: dynamic upsample P4_td to P3 resolution
  - [[4, 15], 1, DynamicBiFPNFusion, [1]] # 16
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 18: downsample P3_out to P4 resolution
  - [[6, 14, 18], 1, DynamicBiFPNFusion, [1]] # 19
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 21: downsample P4_out to P5 resolution
  - [[11, 21], 1, DynamicBiFPNFusion, [1]] # 22
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # 24: Detect(P3, P4, P5)
