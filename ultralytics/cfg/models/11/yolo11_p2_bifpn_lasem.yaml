# YOLO11 + P2 head + Dynamic BiFPN neck + DySample upsampling + LASEM + Wise-IoU v3, for VisDrone small-object
# detection. Backbone and the LASEM module (layer 11) are byte-identical to yolo11_lasem.yaml, so pretrained
# yolo11n.pt backbone weights still load via the standard Ultralytics intersect-by-shape mechanism; only the
# neck/head (new) and the loss (opt-in via `iou_loss` below) differ.
#
# Component-by-component rationale (see nn/modules/dysample.py, nn/modules/bifpn.py, utils/wiou.py, and
# IMPLEMENTATION_REPORT.md for full detail/citations):
#   - P2/4 detection branch (layers 18-20, added to Detect): VisDrone objects frequently fall below the
#     effective receptive field of a P3/8 head; a P2 branch detects objects down to ~4x4-8x8 px, a standard
#     extension across 2023-2025 UAV/VisDrone YOLO papers (e.g. DRS-YOLO, SMA-YOLO).
#   - DynamicBiFPNFusion (replaces plain PAN `Concat` at every fusion node): EfficientDet-style learnable,
#     normalized per-branch fusion weights (Tan, Pang, Le, CVPR 2020, arXiv:1911.09070) plus a per-sample
#     content-adaptive gate (the "Dynamic" component). Ablation: pass `dynamic=False` for static-only BiFPN,
#     or `weighted=False` for plain unweighted Concat (drop-in PAN-neck baseline).
#   - DySample (replaces `nn.Upsample` in the top-down pass): content-aware dynamic point-sampling upsampler
#     (Liu, Lu, Fu, ICCV 2023, arXiv:2308.15085), official impl. Ablation: pass `enabled=False` for a
#     nearest-neighbor fallback (byte-equivalent to the original neck's upsampling).
#   - Wise-IoU v3 box loss (`iou_loss: wiou_v3` below, wired in utils/loss.py `BboxLoss`): Tong, Chen, Xu,
#     2023, arXiv:2301.10051, dynamic non-monotonic focusing on the noisy/ambiguous small-object boxes common
#     in VisDrone. Ablation: remove the `iou_loss` key (or set to "ciou") to fall back to stock CIoU.
#   - LASEM (layer 11, unchanged): kept exactly where the existing, working yolo11_lasem.yaml places it.

# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
iou_loss: wiou_v3 # opt-in Wise-IoU v3 box-regression loss (utils/wiou.py); absent/other value = stock CIoU
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (unchanged from yolo11_lasem.yaml - keeps pretrained yolo11n.pt weight compatibility)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 (P2 tap)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (P3 tap)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (P4 tap)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, LASEM, []] # 11 - small-object enhancement on the deepest backbone feature, before the neck (unchanged position)

# P2 + Dynamic BiFPN + DySample head
head:
  # ---- top-down pass (P5 -> P4 -> P3 -> P2), DySample upsampling + DynamicBiFPNFusion weighted fusion ----
  - [-1, 1, DySample, [2, "lp", 4, True]] # 12: dynamic upsample P5(LASEM) to P4 resolution
  - [[6, 12], 1, DynamicBiFPNFusion, [1]] # 13: weighted-fuse backbone-P4 + upsampled-P5
  - [-1, 2, C3k2, [512, False]] # 14 (P4_td)

  - [-1, 1, DySample, [2, "lp", 4, True]] # 15: dynamic upsample P4_td to P3 resolution
  - [[4, 15], 1, DynamicBiFPNFusion, [1]] # 16: weighted-fuse backbone-P3 + upsampled-P4_td
  - [-1, 2, C3k2, [256, False]] # 17 (P3_td)

  - [-1, 1, DySample, [2, "lp", 4, True]] # 18: dynamic upsample P3_td to P2 resolution
  - [[2, 18], 1, DynamicBiFPNFusion, [1]] # 19: weighted-fuse backbone-P2 + upsampled-P3_td
  - [-1, 2, C3k2, [128, False]] # 20 (P2/4-xsmall) - new P2 detection branch

  # ---- bottom-up pass (P2 -> P3 -> P4 -> P5), strided Conv downsampling + DynamicBiFPNFusion ----
  - [-1, 1, Conv, [128, 3, 2]] # 21: downsample P2_out to P3 resolution
  - [[4, 17, 21], 1, DynamicBiFPNFusion, [1]] # 22: weighted-fuse backbone-P3 + P3_td + downsampled-P2_out (BiFPN skip edge)
  - [-1, 2, C3k2, [256, False]] # 23 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 24: downsample P3_out to P4 resolution
  - [[6, 14, 24], 1, DynamicBiFPNFusion, [1]] # 25: weighted-fuse backbone-P4 + P4_td + downsampled-P3_out (BiFPN skip edge)
  - [-1, 2, C3k2, [512, False]] # 26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 27: downsample P4_out to P5 resolution
  - [[11, 27], 1, DynamicBiFPNFusion, [1]] # 28: weighted-fuse LASEM-enhanced-P5 + downsampled-P4_out
  - [-1, 2, C3k2, [1024, True]] # 29 (P5/32-large)

  - [[20, 23, 26, 29], 1, Detect, [nc]] # 30: Detect(P2, P3, P4, P5)
