# YOLO11 + P2 head + Dynamic BiFPN neck + DySample upsampling + Wise-IoU v3
# LASEM REMOVED (Ablation Model)

nc: 80
iou_loss: wiou_v3

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0
  - [-1, 1, Conv, [128, 3, 2]]         # 1
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10

head:

  # ---------------- Top Down ----------------

  - [-1, 1, DySample, [2, "lp", 4, True]]      # 11
  - [[6,11], 1, DynamicBiFPNFusion, [1]]       # 12
  - [-1, 2, C3k2, [512, False]]                # 13

  - [-1, 1, DySample, [2, "lp", 4, True]]      # 14
  - [[4,14], 1, DynamicBiFPNFusion, [1]]       # 15
  - [-1, 2, C3k2, [256, False]]                # 16

  - [-1, 1, DySample, [2, "lp", 4, True]]      # 17
  - [[2,17], 1, DynamicBiFPNFusion, [1]]       # 18
  - [-1, 2, C3k2, [128, False]]                # 19

  # ---------------- Bottom Up ----------------

  - [-1, 1, Conv, [128,3,2]]                   # 20
  - [[4,16,20],1,DynamicBiFPNFusion,[1]]       # 21
  - [-1,2,C3k2,[256,False]]                    # 22

  - [-1,1,Conv,[256,3,2]]                      # 23
  - [[6,13,23],1,DynamicBiFPNFusion,[1]]       # 24
  - [-1,2,C3k2,[512,False]]                    # 25

  - [-1,1,Conv,[512,3,2]]                      # 26
  - [[10,26],1,DynamicBiFPNFusion,[1]]         # 27
  - [-1,2,C3k2,[1024,True]]                    # 28

  - [[19,22,25,28],1,Detect,[nc]]              # 29